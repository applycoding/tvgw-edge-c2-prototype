[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvgw"
version = "0.1.0"
description = "Edge-AI-to-C2 RF Message Gateway prototype (TRL-4 laboratory evidence)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved; evaluation-only permission (see LICENSE)" }
dependencies = [
    "lxml==6.1.3",
    "cbor2==6.1.5",
    "zstandard==0.25.0",
    "PyYAML==6.0.3",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "Pillow==13.0.0",
]

[project.urls]
Homepage = "https://github.com/applycoding/tvgw-edge-c2-prototype"
Repository = "https://github.com/applycoding/tvgw-edge-c2-prototype"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.11"]

[project.scripts]
tvgw = "tvgw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
